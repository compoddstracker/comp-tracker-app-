name: Android build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Build test app (APK) and store bundle (AAB, unsigned)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: comp-tracker-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Save the store bundle to the "builds" branch (signed later, off GitHub)
        run: |
          mkdir -p /tmp/out && cp android/app/build/outputs/bundle/release/*.aab /tmp/out/comp-tracker-unsigned.aab && cp android/app/build/outputs/apk/debug/*.apk /tmp/out/comp-tracker.apk
          cd /tmp/out && git init -q -b builds && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "AAB from ${GITHUB_SHA}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
